[package]
name = "dagscape"
version = "0.1.0"
description = "Dagscape - a branch graph browser for Git"
authors = ["ytyng"]
license = "MIT"
publish = false
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dagscape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 読み取り専用なので https / ssh は要らない。vendored にして CI (Windows) でも同じ libgit2 を使う
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
notify = "8"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
